name: Elyndor V3 Etape 9

on:
  push:
    branches:
      - claude/new-session-glwy6e

permissions:
  contents: write

jobs:
  migrate-step9:
    if: ${{ github.event.head_commit.message != 'V3 étape 9 — relations entre royaumes' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Installer les dépendances
        run: npm ci
      - name: Appliquer étape 9
        run: node scripts/v3-step9-relations.js
      - name: Validation TypeScript
        run: npx tsc --noEmit
      - name: Garde-fous finaux
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const data = JSON.parse(fs.readFileSync('src/data/elyndorLore.json', 'utf8'));
          const rels = data.entries.filter(e => e.category === 'RELATION_ROYAUME');
          if (data.entry_count !== 265 || data.entries.length !== 265) throw new Error(`entry_count invalide ${data.entry_count}/${data.entries.length}`);
          if (rels.length !== 9) throw new Error(`9 relations attendues, trouvé ${rels.length}`);
          const requiredPairs = ['PARIS_TOKYO','TOKYO_DELHI','TOKYO_LAGOS','OSLO_ISTANBUL','ISTANBUL_ZURICH','JOHANNESBURG_BOGOTA','MEXICO_NEW_YORK','NEW_YORK_BOGOTA','SYDNEY_AUCKLAND'];
          for (const pair of requiredPairs) {
            if (!rels.some(e => String(e.title).startsWith(`[RELATION][${pair}]`))) throw new Error(`Relation absente: ${pair}`);
          }
          const required = ['INTÉRÊT COMMUN :','CONFLIT :','DÉPENDANCE :','PEUR :','RESSOURCE STRATÉGIQUE :','DETTE :','LIGNE ROUGE :','ÉTAT DIPLOMATIQUE :','CONSÉQUENCES NARRATIVES :'];
          for (const e of rels) {
            for (const field of required) if (!e.content.includes(field)) throw new Error(`${e.id}: champ absent ${field}`);
            if (e.lore_level !== 1 || e.priority !== 27 || e.constant !== false) throw new Error(`${e.id}: métadonnées invalides`);
            if (e.content.length > 1500) throw new Error(`${e.id}: entrée trop longue`);
          }
          const ids = data.entries.map(e => e.id);
          if (new Set(ids).size !== ids.length) throw new Error('UID dupliqués');
          for (let id = 102; id <= 117; id++) if (ids.includes(id)) throw new Error(`UID réservé utilisé ${id}`);
          console.log('Garde-fous Step 9 OK');
          NODE
      - name: Finaliser le rapport
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const p = 'docs/v3/STEP9_RELATIONS_ROYAUMES_V3.md';
          let s = fs.readFileSync(p, 'utf8');
          s = s.replace('**VALIDÉE** si le workflow Step 9, TypeScript et les garde-fous finaux passent avant le commit.', '**VALIDÉE**\n\nMigration Step 9 : **PASS**. Validation TypeScript : **PASS**. Garde-fous structurels : **PASS**.');
          fs.writeFileSync(p, s);
          NODE
      - name: Commit étape 9
        run: |
          git config user.name "artisanguillonrenov-creator"
          git config user.email "artisanguillonrenov@gmail.com"
          git add src/data/elyndorLore.json docs/v3/STEP9_RELATIONS_ROYAUMES_V3.md
          git diff --cached --exit-code && { echo 'Aucun changement à committer'; exit 1; } || true
          git commit -m "V3 étape 9 — relations entre royaumes"
          git push origin HEAD:claude/new-session-glwy6e
