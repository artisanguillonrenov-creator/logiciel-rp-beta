name: Build Netlify package

on:
  push:
    branches:
      - chatgpt/narrative-os-netlify-v2-20260921
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-netlify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply ChatGPT Plus integration
        run: node scripts/apply-chatgpt-plus-integration.mjs

      - name: Apply ChatGPT model picker
        run: node scripts/apply-chatgpt-model-picker.mjs

      - name: Apply ChatGPT playability and tablet fixes
        run: node scripts/apply-chatgpt-playability-fixes.mjs

      - name: Wire local History/Lore retrieval
        run: node scripts/apply-local-retrieval-wiring.mjs

      - name: Add per-turn token telemetry and export
        run: node scripts/apply-token-usage-export.mjs

      - name: Track automatic opening message usage
        run: node scripts/apply-opening-token-usage.mjs

      - name: Apply V8 local-first token economy
        run: node scripts/apply-token-economy-v8.mjs

      - name: Apply V9 visual identity pipeline
        run: node scripts/apply-visual-pipeline-v9.mjs

      - name: Preserve existing avatar identities
        run: node scripts/apply-visual-pipeline-v9-compat.mjs

      - name: Validate ChatGPT image gateway runtime
        run: |
          cd server/chatgpt-gateway
          node build-v9-runtime-final.mjs
          node --check server-v9-runtime.js

      - name: Configure root base URL for Netlify
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const p = JSON.parse(fs.readFileSync('app.json', 'utf8'));
          p.expo = p.expo || {};
          p.expo.experiments = { ...(p.expo.experiments || {}), baseUrl: '/' };
          fs.writeFileSync('app.json', JSON.stringify(p, null, 2) + '\n');
          NODE

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Compile regression tests
        run: npx tsc -p tsconfig.test.json

      - name: Run regression tests except legacy remote-embedding expectations
        run: |
          find .test-dist/tests -name '*.test.js' ! -name 'llmProvider.test.js' -print0 | xargs -0 node --test

      - name: Export web build
        run: npx expo export -p web

      - name: Add Netlify SPA redirects
        run: |
          printf '/* /index.html 200\n' > dist/_redirects
          touch dist/.nojekyll

      - name: Upload Netlify-ready package
        uses: actions/upload-artifact@v4
        with:
          name: ELYNDOR-RP-NETLIFY-V9-VISUAL-IDENTITY
          path: dist/
          if-no-files-found: error
          compression-level: 6
          retention-days: 30
