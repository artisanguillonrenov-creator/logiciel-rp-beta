name: Diagnostic pipeline temporary CI

on:
  push:
    branches:
      - chatgpt/diagnostic-pipeline-20261006

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
