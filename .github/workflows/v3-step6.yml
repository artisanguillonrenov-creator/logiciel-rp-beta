name: Elyndor V3 Etape 6

on:
  push:
    branches:
      - claude/new-session-glwy6e

jobs:
  validate-lore-core:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Installer les dépendances
        run: npm ci
      - name: Compiler la suite de tests
        run: rm -rf .test-dist && npx tsc -p tsconfig.test.json
      - name: Tester le Lore Core
        run: node --test .test-dist/tests/loreCore.test.js
      - name: TypeScript application
        run: npx tsc --noEmit
