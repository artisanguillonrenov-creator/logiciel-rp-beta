name: Publish OTA Update (EAS)

on:
  push:
    branches:
      - claude/new-session-glwy6e
  pull_request:
    branches:
      - claude/new-session-glwy6e
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      message:
        description: Description du correctif publié
        required: false
        default: Mise à jour

concurrency:
  group: eas-preview
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: npm ci

      - run: npm install --global eas-cli

      - name: Publish OTA update (channel preview)
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            UPDATE_MESSAGE="Prélecture PR #${{ github.event.pull_request.number }} - $GITHUB_SHA"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            UPDATE_MESSAGE="${{ github.event.inputs.message }}"
          else
            UPDATE_MESSAGE="Mise à jour automatique $GITHUB_SHA"
          fi
          eas update --channel preview --message "$UPDATE_MESSAGE" --non-interactive
