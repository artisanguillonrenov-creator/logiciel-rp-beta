name: Publish OTA Update (EAS)

on:
  push:
    branches:
      - claude/new-session-glwy6e
  workflow_dispatch:
    inputs:
      message:
        description: Description du correctif publié
        required: false
        default: Mise à jour

concurrency:
  group: eas-preview
  cancel-in-progress: true

jobs:
  v3-step3-migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/new-session-glwy6e
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Appliquer Elyndor V3 étape 3
        run: python .github/scripts/v3_step3.py

      - run: npm ci

      - name: Vérifier TypeScript
        run: npx tsc --noEmit

      - name: Vérifier le diff
        run: git diff --check

      - name: Commit étape 3
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/elyndorLore.json src/data/metamoteurs.json src/engine/contenuAdulte.ts src/engine/promptBuilder.ts src/engine/generateTurn.ts docs/v3/STEP3_REGISTRE_STYLE_PARAMETRES_V3.md
          git diff --cached --quiet && exit 0
          git commit -m "V3 étape 3 — registre style et paramètres"
          git push origin HEAD:claude/new-session-glwy6e

  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: npm ci

      - run: npm install --global eas-cli

      - name: Publish OTA update (channel preview)
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            UPDATE_MESSAGE="${{ github.event.inputs.message }}"
          else
            UPDATE_MESSAGE="Mise à jour automatique $GITHUB_SHA"
          fi
          eas update --channel preview --message "$UPDATE_MESSAGE" --non-interactive
