name: Publish OTA Update (EAS)

on:
  push:
    branches:
      - claude/new-session-glwy6e
  workflow_dispatch:
    inputs:
      message:
        description: Description du correctif publié
        required: false
        default: Mise à jour

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - run: npm install --global eas-cli

      - name: Publish OTA update (channel preview)
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          UPDATE_MESSAGE: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.message || format('Mise à jour automatique {0}', github.sha) }}
        run: eas update --channel preview --message "$UPDATE_MESSAGE" --non-interactive
