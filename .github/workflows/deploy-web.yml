name: Déployer la version web (GitHub Pages)

on:
  push:
    branches: [claude/new-session-glwy6e]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: github-pages-publish
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: npm ci

      - run: npx expo export -p web

      - name: Publier sur gh-pages sans supprimer les prélectures PR
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin gh-pages
          git worktree add gh-pages-deploy origin/gh-pages

          # Nettoie uniquement la version principale. Les dossiers pr-* restent
          # disponibles tant que leur demande de fusion est ouverte.
          find gh-pages-deploy -mindepth 1 -maxdepth 1 \
            ! -name '.git' \
            ! -name 'pr-*' \
            -exec rm -rf {} +

          cp -r dist/. gh-pages-deploy/
          touch gh-pages-deploy/.nojekyll
          cd gh-pages-deploy
          git add -A
          git diff --cached --quiet && echo "Rien à publier" && exit 0
          git commit -m "Déploie automatiquement depuis ${{ github.sha }}"
          git push origin HEAD:gh-pages
