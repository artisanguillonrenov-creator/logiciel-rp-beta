name: Build Android APK (EAS local)

on:
  push:
    branches:
      - claude/new-session-glwy6e
      - chatgpt/android-gguf-local-model
    paths:
      - app.json
      - eas.json
      - package.json
      - package-lock.json
      - plugins/**
      - src/engine/localInference.ts
      - src/storage/modeleLocalStore.ts
      - .github/workflows/eas-build-android.yml
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # npm install garde package-lock.json synchronisé avec package.json dans
      # l'espace de travail avant le build EAS local. C'est nécessaire pour les
      # dépendances natives ajoutées sur cette branche de test Android.
      - run: npm install --no-audit --no-fund

      - run: npm install --global eas-cli

      - name: Configurer la mémoire Gradle
        run: |
          mkdir -p "$HOME/.gradle"
          cat > "$HOME/.gradle/gradle.properties" <<'EOF'
          org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
          org.gradle.daemon=false
          org.gradle.workers.max=2
          kotlin.daemon.jvmargs=-Xmx768m
          EOF

      - name: Build Android APK localement sur GitHub Actions
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EAS_LOCAL_BUILD_ARTIFACTS_DIR: ${{ github.workspace }}/artifacts
        run: eas build --platform android --profile preview --local --non-interactive

      - name: Publier l'APK comme artefact GitHub
        uses: actions/upload-artifact@v4
        with:
          name: logiciel-rp-beta-android-apk
          path: artifacts/**/*.apk
          if-no-files-found: error
          retention-days: 7
