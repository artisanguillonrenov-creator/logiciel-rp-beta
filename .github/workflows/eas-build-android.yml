name: Build Android APK (EAS local)

on:
  push:
    branches:
      - claude/new-session-glwy6e
      - claude/focused-carson-wgfz3x
      - chatgpt/diagnostic-pipeline-20261006
    # Un APK à chaque modification de l'application : la mise à jour OTA
    # n'arrive pas toujours sur l'appareil. Seuls les changements de
    # documentation n'en déclenchent pas.
    paths-ignore:
      - '**.md'
      - docs/**
      - art-direction-concepts/**
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: npm ci

      - run: npx tsc --noEmit

      - run: npm install --global eas-cli

      - name: Configurer la mémoire Gradle
        run: |
          mkdir -p "$HOME/.gradle"
          cat > "$HOME/.gradle/gradle.properties" <<'EOF'
          org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
          org.gradle.daemon=false
          org.gradle.workers.max=2
          kotlin.daemon.jvmargs=-Xmx768m
          EOF

      - name: Build Android APK localement sur GitHub Actions
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_PUBLIC_GIT_SHA: ${{ github.sha }}
          EAS_LOCAL_BUILD_ARTIFACTS_DIR: ${{ github.workspace }}/artifacts
        run: eas build --platform android --profile preview --local --non-interactive

      - name: Publier l'APK comme artefact GitHub
        uses: actions/upload-artifact@v4
        with:
          name: logiciel-rp-beta-android-apk
          path: artifacts/**/*.apk
          if-no-files-found: error
          retention-days: 7
