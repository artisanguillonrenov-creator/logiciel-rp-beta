name: Build Android APK (EAS local)

on:
  push:
    branches:
      - claude/new-session-glwy6e
    paths:
      - app.json
      - eas.json
      - package.json
      - package-lock.json
      - plugins/**
      - .github/workflows/eas-build-android.yml
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - run: npm install --global eas-cli

      - name: Build Android APK localement sur GitHub Actions
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EAS_LOCAL_BUILD_ARTIFACTS_DIR: ${{ github.workspace }}/artifacts
        run: eas build --platform android --profile preview --local --non-interactive

      - name: Publier l'APK comme artefact GitHub
        uses: actions/upload-artifact@v4
        with:
          name: logiciel-rp-beta-android-apk
          path: artifacts/**/*.apk
          if-no-files-found: error
          retention-days: 7
