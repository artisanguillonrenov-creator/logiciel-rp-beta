name: Build Android APK (EAS)

on:
  push:
    branches:
      - claude/new-session-glwy6e
    paths:
      - app.json
      - eas.json
      - package.json
      - package-lock.json
      - plugins/**
      - .github/workflows/eas-build-android.yml
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - run: npm install --global eas-cli

      - name: Build Android (profil preview, APK sideload)
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: eas build --platform android --profile preview --non-interactive --wait
