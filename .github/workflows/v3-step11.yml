name: Elyndor V3 Etape 11

on:
  push:
    branches:
      - claude/new-session-glwy6e

permissions:
  contents: write

jobs:
  migrate-step11:
    if: ${{ github.event.head_commit.message != 'V3 étape 11 — ancres canoniques explicites' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Appliquer étape 11
        run: |
          python - <<'PY'
          from pathlib import Path

          loader_path = Path('src/engine/loreLoader.ts')
          loader = loader_path.read_text()
          marker = "const PREFIXE_ROYAUME = '[ROYAUME] ';"
          if marker not in loader:
              raise SystemExit('Bloc ancien des ancres introuvable')
          loader = loader[:loader.index(marker)] + r'''const SCOPES_ANCRABLES = new Set<ScopeLore>(['CITY', 'FACTION', 'CHARACTER']);

/** Retire tous les préfixes [CATÉGORIE]/[VILLE] et les suffixes descriptifs. */
function sujetCanoniqueTitre(titre: string): string {
  let sujet = titre.trim();
  while (/^\[[^\]]+\]\s*/.test(sujet)) sujet = sujet.replace(/^\[[^\]]+\]\s*/, '');
  return sujet.split(/\s+[—–]\s+/)[0]?.trim() ?? sujet;
}

function estEntreeAncrable(entree: ElyndorEntryChargee): boolean {
  // Les index servent à relier des fiches ; ils ne doivent jamais remplacer
  // la fiche individuelle lorsqu'un nom propre est explicitement cité.
  if (entree.titre.toUpperCase().includes('[INDEX]')) return false;

  const scope = entree.scope ?? infererScopeLore(entree.category);
  if (SCOPES_ANCRABLES.has(scope)) return true;

  // Support explicite des autres familles demandées par la directive V3,
  // y compris pour de futures fiches nommées qui resteraient de scope GLOBAL.
  const categorie = normalise(entree.category ?? '');
  const titre = normalise(entree.titre);
  return [
    'royaume', 'ville', 'guilde', 'faction', 'pnj', 'personnage',
    'religion', 'culte', 'artefact', 'zone corrompue', 'porte astra',
  ].some((motif) => categorie.includes(motif) || titre.includes(motif));
}

function contientExpressionCanonique(requeteNormalisee: string, aliasNormalise: string): boolean {
  if (aliasNormalise.length < 3) return false;
  return ` ${requeteNormalisee} `.includes(` ${aliasNormalise} `);
}

function aliasesCanoniques(entree: ElyndorEntryChargee): string[] {
  const sujet = normalise(sujetCanoniqueTitre(entree.titre));
  if (!sujet) return [];
  const aliases = new Set<string>([sujet]);

  // Une clé existante n'est promue comme alias d'ancre que si elle contient
  // réellement le sujet canonique (ou inversement). Cela accepte par exemple
  // "Séraphine Duvall Paris" sans transformer un rôle générique comme
  // "maîtresse de guilde" en faux nom propre.
  for (const cle of [...(entree.primaryKeys ?? []), ...(entree.secondaryKeys ?? [])]) {
    const alias = normalise(cle);
    if (!alias || alias.length < 3) continue;
    if (alias.includes(sujet) || sujet.includes(alias)) aliases.add(alias);
  }
  return [...aliases];
}

/**
 * V3 étape 11 — ancres canoniques.
 * Un nom explicite force sa fiche statique même si embedding/lexical restent
 * sous le seuil. Les ancres sont distinctes du quota des 8 entrées
 * contextuelles et ne sont jamais limitées artificiellement à deux noms.
 */
export function extraireAncresCanoniques(
  texteRequete: string,
  entrees: ElyndorEntryChargee[],
): LoreEntry[] {
  const requete = normalise(texteRequete);
  const notes: { entree: ElyndorEntryChargee; position: number }[] = [];

  for (const entree of entrees) {
    if (!estEntreeAncrable(entree)) continue;
    let meilleurePosition = Number.POSITIVE_INFINITY;
    for (const alias of aliasesCanoniques(entree)) {
      if (!contientExpressionCanonique(requete, alias)) continue;
      const position = requete.indexOf(alias);
      if (position >= 0) meilleurePosition = Math.min(meilleurePosition, position);
    }
    if (!Number.isFinite(meilleurePosition)) continue;
    notes.push({ entree, position: meilleurePosition });
  }

  notes.sort((a, b) =>
    a.position - b.position
    || a.entree.priority - b.entree.priority
    || a.entree.titre.localeCompare(b.entree.titre),
  );

  return notes.map(({ entree }) => ({
    id: entree.id,
    titre: entree.titre,
    contenu: entree.contenu,
    score: 3,
  }));
}

/**
 * Place les noms canoniques explicitement cités avant le classement normal.
 * Le Lore Core / socle reste ensuite garanti par la sélection existante.
 */
export function prioriserLoreCanon(
  texteRequete: string,
  selection: LoreEntry[],
  entrees: ElyndorEntryChargee[],
): LoreEntry[] {
  const ancres = extraireAncresCanoniques(texteRequete, entrees);
  const vus = new Set<string>();
  const resultat: LoreEntry[] = [];
  for (const e of [
    ...ancres,
    ...selection.filter((s) => s.score !== undefined),
    ...selection.filter((s) => s.score === undefined),
  ]) {
    if (vus.has(e.id)) continue;
    vus.add(e.id);
    resultat.push(e);
  }
  return resultat;
}
'''
          loader_path.write_text(loader)

          tests = r'''import assert from 'node:assert/strict';
import test from 'node:test';
import { extraireAncresCanoniques, prioriserLoreCanon, type ElyndorEntryChargee } from '../src/engine/loreLoader';
import type { LoreEntry } from '../src/types';

function entree(
  id: string,
  titre: string,
  category: string,
  scope: ElyndorEntryChargee['scope'],
  primaryKeys: string[] = [],
): ElyndorEntryChargee {
  return {
    id,
    titre,
    contenu: `Fiche canonique de ${titre}`,
    motsClesNegatifs: [],
    primaryKeys,
    secondaryKeys: [],
    negativeKeys: [],
    priority: 20,
    constant: false,
    category,
    scope,
  };
}

const paris = entree('paris', '[ROYAUME] Paris — Royaume Humain', 'ROYAUME', 'CITY', ['Paris']);
const seraphine = entree(
  'seraphine',
  '[PNJ] [PNJ][PARIS] Séraphine Duvall — Direction guilde',
  'PNJ',
  'CHARACTER',
  ['Séraphine Duvall', 'Séraphine Duvall Paris', 'maîtresse de guilde'],
);
const ordre = entree('mages', '[GUILDE] Ordre des Mages', 'GUILDE', 'FACTION', ['ordre des mages']);

test('un royaume explicitement nommé est forcé même sans résultat de recherche', () => {
  const resultat = prioriserLoreCanon('Je reviens à Paris.', [], [paris]);
  assert.deepEqual(resultat.map((e) => e.id), ['paris']);
  assert.equal(resultat[0].score, 3);
});

test('Séraphine Duvall force sa fiche PNJ malgré les doubles préfixes du titre', () => {
  const ancres = extraireAncresCanoniques('Je parle à Séraphine Duvall.', [seraphine]);
  assert.deepEqual(ancres.map((e) => e.id), ['seraphine']);
});

test('un rôle générique ne déclenche pas faussement une fiche de personnage', () => {
  const ancres = extraireAncresCanoniques('Je demande à parler à la maîtresse de guilde.', [seraphine]);
  assert.deepEqual(ancres, []);
});

test('plus de deux noms explicites sont tous ancrés sans plafond artificiel', () => {
  const ancres = extraireAncresCanoniques(
    'À Paris, Séraphine Duvall demande conseil à l’Ordre des Mages.',
    [paris, seraphine, ordre],
  );
  assert.deepEqual(ancres.map((e) => e.id), ['paris', 'seraphine', 'mages']);
});

test('les index ne remplacent jamais les fiches individuelles', () => {
  const index = entree('index', '[INDEX] [INDEX][PARIS] PNJ récurrents', 'INDEX', 'CHARACTER', ['PNJ Paris']);
  const ancres = extraireAncresCanoniques('Je consulte les PNJ récurrents.', [index]);
  assert.deepEqual(ancres, []);
});

test('religion, porte nommée, artefact et zone nommée sont ancrables même en scope global', () => {
  const culte = entree('culte', '[MONDE] Culte des Voiles', 'MONDE', 'GLOBAL');
  const porte = entree('porte', '[MONDE] Porte Astra de Tokyo — Porte majeure', 'MONDE', 'GLOBAL');
  const artefact = entree('artefact', '[MONDE] Lame des Voiles — Artefact majeur', 'MONDE', 'GLOBAL');
  const zone = entree('zone', '[MONDE] Cratère d’Albi — Zone Corrompue majeure', 'MONDE', 'GLOBAL');
  const ancres = extraireAncresCanoniques(
    'Le Culte des Voiles transporte la Lame des Voiles vers le Cratère d’Albi par la Porte Astra de Tokyo.',
    [culte, porte, artefact, zone],
  );
  assert.deepEqual(new Set(ancres.map((e) => e.id)), new Set(['culte', 'porte', 'artefact', 'zone']));
});

test('une fiche déjà sélectionnée n’est jamais injectée deux fois', () => {
  const selection: LoreEntry[] = [{ id: 'seraphine', titre: seraphine.titre, contenu: seraphine.contenu, score: 0.31 }];
  const resultat = prioriserLoreCanon('Séraphine Duvall me répond.', selection, [seraphine]);
  assert.equal(resultat.filter((e) => e.id === 'seraphine').length, 1);
  assert.equal(resultat[0].score, 3);
});

test('les ancres passent avant le lore contextuel puis le socle', () => {
  const selection: LoreEntry[] = [
    { id: 'contexte', titre: '[MONDE] Commerce', contenu: 'Commerce', score: 0.91 },
    { id: 'socle', titre: '[MONDE] Présentation', contenu: 'Socle' },
  ];
  const resultat = prioriserLoreCanon('Je rencontre Séraphine Duvall.', selection, [seraphine]);
  assert.deepEqual(resultat.map((e) => e.id), ['seraphine', 'contexte', 'socle']);
});
'''
          Path('tests/loreAnchorsStep11.test.ts').write_text(tests)

          report = '''# ELYNDOR — V3 ÉTAPE 11 — ANCRES CANONIQUES\n\n## A — Modifications effectuées\n\n- Généralisation de l’ancrage canonique au-delà des seuls royaumes.\n- Un nom canonique explicitement cité force désormais la récupération de sa fiche statique, même sous le seuil sémantique/lexical.\n- Familles prises en charge : royaumes/villes, souverains et PNJ récurrents, factions, guildes, religions/cultes, Portes Astra nommées, artefacts majeurs et Zones Corrompues majeures.\n- Les ancres sont injectées avant les résultats contextuels et ne consomment pas artificiellement le quota des 8 résultats contextuels.\n- Suppression de l’ancien plafond de deux ancres.\n- Déduplication conservée lorsqu’une fiche ancrée est déjà présente dans la sélection normale.\n- Les entrées `[INDEX]` sont explicitement exclues des ancres individuelles.\n- Les intitulés génériques présents dans les clés (ex. rôle de guilde) ne sont pas promus en noms propres.\n\n## B — Informations déplacées\n\nAucune information canonique déplacée. La modification concerne uniquement la logique de récupération.\n\n## C — Informations supprimées\n\nAucune information de lore supprimée. L’ancien mécanisme limité aux `[ROYAUME]` et à deux ancres maximum est remplacé.\n\n## D — Contradictions découvertes\n\n- Les fiches PNJ atomisées de l’étape 4 peuvent contenir plusieurs préfixes `[PNJ][VILLE]`; l’ancien extracteur de sujet n’aurait retiré qu’un seul préfixe.\n- Les index de PNJ contiennent eux aussi des noms propres ; ils doivent rester des aides d’association et ne jamais prendre la place de la fiche individuelle.\n\n## E — Risques\n\n- Un alias trop générique pourrait provoquer une sur-récupération ; l’étape 11 limite donc les alias forcés au sujet canonique du titre et aux clés qui contiennent réellement ce sujet.\n- Les catégories encore inexistantes (par exemple une future Porte Astra nommée ou Zone Corrompue nommée) sont supportées par le moteur sans inventer de nouveau lore.\n\n## F — Tests réalisés\n\n- Royaume explicitement nommé malgré sélection vide.\n- Séraphine Duvall avec préfixes imbriqués.\n- Refus d’un faux ancrage sur rôle générique.\n- Plus de deux noms explicitement cités dans une même requête.\n- Exclusion des index.\n- Support religion / Porte Astra / artefact / Zone Corrompue nommés.\n- Déduplication d’une fiche déjà sélectionnée.\n- Ordre : ancres → contexte classé → socle.\n- `npm test`.\n- `npx tsc --noEmit`.\n- Garde-fou : `elyndorLore.json` reste inchangé pendant cette étape.\n\n## G — Décision\n\n**EN ATTENTE DES TESTS DU WORKFLOW STEP 11**\n'''
          Path('docs/v3/STEP11_ANCRES_CANONIQUES_V3.md').write_text(report)
          PY

      - name: Tests unitaires
        run: npm test

      - name: Validation TypeScript
        run: npx tsc --noEmit

      - name: Garde-fous Step 11
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const loader = fs.readFileSync('src/engine/loreLoader.ts', 'utf8');
          if (!loader.includes('extraireAncresCanoniques')) throw new Error('Moteur d’ancres absent');
          if (!loader.includes("SCOPES_ANCRABLES")) throw new Error('Scopes ancrables absents');
          if (loader.includes('MAX_ANCRES_CANON')) throw new Error('Ancien plafond de deux ancres encore présent');
          if (loader.includes("const PREFIXE_ROYAUME")) throw new Error('Ancien ancrage limité aux royaumes encore présent');
          if (!loader.includes("includes('[INDEX]')")) throw new Error('Exclusion des index absente');
          const lore = JSON.parse(fs.readFileSync('src/data/elyndorLore.json', 'utf8'));
          if (lore.entry_count !== 265 || lore.entries.length !== 265) throw new Error('Lore statique modifié');
          console.log('Garde-fous Step 11 OK');
          NODE
          git diff --exit-code HEAD -- src/data/elyndorLore.json

      - name: Finaliser le rapport
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const p = 'docs/v3/STEP11_ANCRES_CANONIQUES_V3.md';
          let s = fs.readFileSync(p, 'utf8');
          s = s.replace('**EN ATTENTE DES TESTS DU WORKFLOW STEP 11**', '**VALIDÉE**\n\nAncres canoniques : **PASS**. Tests unitaires : **PASS**. Validation TypeScript : **PASS**. Lore statique inchangé : **PASS**.');
          fs.writeFileSync(p, s);
          NODE

      - name: Commit étape 11
        run: |
          git config user.name "artisanguillonrenov-creator"
          git config user.email "artisanguillonrenov@gmail.com"
          git add src/engine/loreLoader.ts tests/loreAnchorsStep11.test.ts docs/v3/STEP11_ANCRES_CANONIQUES_V3.md
          git diff --cached --exit-code && { echo 'Aucun changement à committer'; exit 1; } || true
          git commit -m "V3 étape 11 — ancres canoniques explicites"
          git push origin HEAD:claude/new-session-glwy6e
