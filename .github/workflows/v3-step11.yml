name: Elyndor V3 Step 11 Validation

on:
  push:
    branches:
      - claude/new-session-glwy6e

jobs:
  validate-step11:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Tests unitaires
        run: npm test

      - name: Validation TypeScript
        run: npx tsc --noEmit

      - name: Garde-fous Step 11
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const loader = fs.readFileSync('src/engine/loreLoader.ts', 'utf8');
          if (!loader.includes('extraireAncresCanoniques')) throw new Error('Moteur d ancres absent');
          if (!loader.includes('SCOPES_ANCRABLES')) throw new Error('Scopes ancrables absents');
          if (loader.includes('MAX_ANCRES_CANON')) throw new Error('Ancien plafond de deux ancres encore present');
          if (loader.includes("const PREFIXE_ROYAUME")) throw new Error('Ancien ancrage limite aux royaumes encore present');
          if (!loader.includes("includes('[INDEX]')")) throw new Error('Exclusion des index absente');
          const lore = JSON.parse(fs.readFileSync('src/data/elyndorLore.json', 'utf8'));
          if (lore.entry_count !== 265 || lore.entries.length !== 265) throw new Error('Lore statique modifie');
          console.log('Garde-fous Step 11 OK');
          NODE
