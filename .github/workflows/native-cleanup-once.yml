name: Nettoyage natif ponctuel

on:
  push:
    branches:
      - refactor/elyndor-cloud-native-20261005

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/elyndor-cloud-native-20261005
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Retirer LiteRT du manifeste et du lockfile
        run: npm uninstall expo-litert-lm --package-lock-only --ignore-scripts
      - name: Retirer le plugin Kotlin devenu inutile
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const path = 'app.json';
          const app = JSON.parse(fs.readFileSync(path, 'utf8'));
          app.expo.plugins = (app.expo.plugins || []).filter(
            (plugin) => plugin !== './plugins/withLitertKotlinSkipVersionCheck.js'
          );
          fs.writeFileSync(path, JSON.stringify(app, null, 2) + '\n');
          NODE
          rm -f plugins/withLitertKotlinSkipVersionCheck.js
          rm -f .github/workflows/native-cleanup-once.yml
      - name: Vérifier le lockfile
        run: npm ci --ignore-scripts
      - name: Committer le nettoyage
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "cleanup: remove LiteRT native residue"
          git push origin HEAD:refactor/elyndor-cloud-native-20261005
