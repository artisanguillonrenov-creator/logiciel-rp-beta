name: Elyndor V3 Etape 4 Fix

on:
  push:
    branches:
      - claude/new-session-glwy6e

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/new-session-glwy6e
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Corriger la reconnaissance canonique de Jasmine Nightpaw
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('.github/scripts/v3_step4.py')
          s = p.read_text(encoding='utf-8')
          needle = "    ('homme-bête', 'Homme-Bête'),\n"
          replacement = needle + "    ('féline', 'Homme-Bête'),\n"
          assert needle in s
          p.write_text(s.replace(needle, replacement, 1), encoding='utf-8')
          PY

      - name: Appliquer Elyndor V3 étape 4
        run: python .github/scripts/v3_step4.py

      - run: npm ci

      - name: Vérifier TypeScript
        run: npx tsc --noEmit

      - name: Vérifier le diff
        run: git diff --check

      - name: Commit étape 4
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/elyndorLore.json docs/v3/STEP4_RESTRUCTURATION_ENTREES_LORE_V3.md
          git diff --cached --quiet && exit 0
          git commit -m "V3 étape 4 — atomiser les entrées de lore"
          git push origin HEAD:claude/new-session-glwy6e
