name: Elyndor V3 Etape 10

on:
  push:
    branches:
      - claude/new-session-glwy6e

permissions:
  contents: write

jobs:
  migrate-step10:
    if: ${{ github.event.head_commit.message != 'V3 étape 10 — récupération hybride du lore' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Corriger le générateur Step 10
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/v3-step10-retrieval.js')
          s = p.read_text()
          replacements = [
              ("  const corps = normaliserLore(`${entry.titre} ${entry.contenu}`);", "  const corps = normaliserLore(entry.titre + ' ' + entry.contenu);"),
              ("    titre: `[ROYAUME] Paris secteur ${i}`,", "    titre: '[ROYAUME] Paris secteur ' + i,"),
              ("      id: `c${i}`, titre: `[ROYAUME] Paris ${i}`, contenu: 'Paris.', primaryKeys: ['Paris'], priority: i, category: 'ROYAUME', scope: 'CITY', constant: false,", "      id: 'c' + i, titre: '[ROYAUME] Paris ' + i, contenu: 'Paris.', primaryKeys: ['Paris'], priority: i, category: 'ROYAUME', scope: 'CITY', constant: false,"),
              ("  const entries = Array.from({ length: 12 }, (_, i) => chargee(`e${i}`, `[MONDE] Entrée ${i}`, { category: 'MONDE', scope: 'GLOBAL' }));", "  const entries = Array.from({ length: 12 }, (_, i) => chargee('e' + i, '[MONDE] Entrée ' + i, { category: 'MONDE', scope: 'GLOBAL' }));"),
              (": 0.42 * lexical + 0.25 * primary + 0.10 * secondary + 0.08 * explicite + 0.07 * scope + 0.05 * priorite + 0.03 * categorie;", ": 0.60 * lexical + 0.20 * primary + 0.08 * secondary + 0.05 * explicite + 0.04 * scope + 0.02 * priorite + 0.01 * categorie;"),
          ]
          for old, new in replacements:
              if old not in s:
                  raise SystemExit(f'Bloc de correction introuvable: {old}')
              s = s.replace(old, new, 1)
          p.write_text(s)
          PY
          node --check scripts/v3-step10-retrieval.js

      - name: Mettre à jour le test de registre devenu obsolète
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('tests/contentProfile.test.ts')
          s = p.read_text()
          replacements = [
              ('/Violence : niveau extrême/', '/Violence : plafond extrême/'),
              ('/Romance : niveau élevé/', '/Romance \/ sensualité : plafond élevé/'),
              ('/Violence : niveau faible/', '/Violence : plafond faible/'),
              ('/Romance : désactivée/', '/Romance \/ sensualité : désactivée/'),
          ]
          for old, new in replacements:
              if old not in s:
                  raise SystemExit(f'Assertion obsolète introuvable: {old}')
              s = s.replace(old, new, 1)
          p.write_text(s)
          PY

      - name: Appliquer étape 10
        run: node scripts/v3-step10-retrieval.js

      - name: Tests unitaires
        run: npm test

      - name: Validation TypeScript
        run: npx tsc --noEmit

      - name: Garde-fous Step 10
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const { execFileSync } = require('child_process');
          const after = JSON.parse(fs.readFileSync('src/data/elyndorLore.json', 'utf8'));
          const before = JSON.parse(execFileSync('git', ['show', 'HEAD:src/data/elyndorLore.json'], { encoding: 'utf8' }));
          const scopes = new Set(['GLOBAL','CONTINENT','REGION','CITY','FACTION','CHARACTER','SCENE']);
          if (before.entry_count !== 265 || before.entries.length !== 265) throw new Error('Base Step 9 invalide');
          if (after.entry_count !== 265 || after.entries.length !== 265) throw new Error('Le nombre d’entrées a changé');
          for (const e of after.entries) if (!scopes.has(e.scope)) throw new Error(`Scope invalide ${e.id}: ${e.scope}`);
          const ids = after.entries.map((e) => e.id);
          if (new Set(ids).size !== ids.length) throw new Error('UID dupliqués');
          for (let id = 102; id <= 117; id++) if (ids.includes(id)) throw new Error(`UID réservé utilisé ${id}`);

          const nettoyer = (data) => {
            const clone = JSON.parse(JSON.stringify(data));
            for (const e of clone.entries) delete e.scope;
            clone.corrections_appliquees = (clone.corrections_appliquees ?? []).filter((x) => !String(x).includes('V3 étape 10'));
            return clone;
          };
          if (JSON.stringify(nettoyer(before)) !== JSON.stringify(nettoyer(after))) {
            throw new Error('Le canon narratif a changé au-delà des métadonnées scope');
          }

          const loader = fs.readFileSync('src/engine/loreLoader.ts', 'utf8');
          const lexical = fs.readFileSync('src/engine/rechercheLexicale.ts', 'utf8');
          const scoring = fs.readFileSync('src/engine/loreScoring.ts', 'utf8');
          if (!loader.includes('maxSupplementaires = MAX_LORE_CONTEXTUEL')) throw new Error('Plafond sémantique Step 10 absent');
          if (loader.includes('maxSupplementaires = 18')) throw new Error('Ancien top 18 encore actif');
          if (!loader.includes('primaryKeys') || !loader.includes('secondaryKeys') || !loader.includes('negativeKeys')) throw new Error('Métadonnées positives/non positives non transportées');
          if (!lexical.includes('SEUIL_LORE_HYBRIDE') || !lexical.includes('MAX_LORE_CONTEXTUEL')) throw new Error('Fallback lexical non hybridé');
          if (!scoring.includes("export const SEUIL_LORE_HYBRIDE = 0.30") || !scoring.includes('export const MAX_LORE_CONTEXTUEL = 8')) throw new Error('Seuil/plafond central absent');
          console.log('Garde-fous Step 10 OK');
          NODE

      - name: Finaliser le rapport
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const p = 'docs/v3/STEP10_RECUPERATION_LORE_V3.md';
          let s = fs.readFileSync(p, 'utf8');
          s = s.replace('**EN ATTENTE DES TESTS DU WORKFLOW STEP 10**', '**VALIDÉE**\n\nMigration Step 10 : **PASS**. Tests unitaires : **PASS**. Validation TypeScript : **PASS**. Garde-fous structurels : **PASS**.');
          s = s.replace('## D — Contradictions découvertes\n', '## D — Contradictions découvertes\n\n- Un ancien test du registre Adulte attendait encore le vocabulaire « niveau » alors que le moteur validé utilise désormais « plafond » ; assertion mise à jour sans modifier le comportement du moteur.\n');
          fs.writeFileSync(p, s);
          NODE

      - name: Commit étape 10
        run: |
          git config user.name "artisanguillonrenov-creator"
          git config user.email "artisanguillonrenov@gmail.com"
          git add src/data/elyndorLore.json src/engine/loreScoring.ts src/engine/loreLoader.ts src/engine/rechercheLexicale.ts tests/loreRetrievalStep10.test.ts tests/contentProfile.test.ts docs/v3/STEP10_RECUPERATION_LORE_V3.md
          git diff --cached --exit-code && { echo 'Aucun changement à committer'; exit 1; } || true
          git commit -m "V3 étape 10 — récupération hybride du lore"
          git push origin HEAD:claude/new-session-glwy6e
