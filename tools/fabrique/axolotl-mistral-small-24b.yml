# Entraînement LoRA (QLoRA) du narrateur léger sur Mistral Small 24B.
# Données : elyndor-rp.jsonl produit par tools/fabrique/exporter.ts
# (format « messages », seule la réponse finale est apprise).
base_model: mistralai/Mistral-Small-24B-Instruct-2501
model_type: AutoModelForCausalLM
tokenizer_type: AutoTokenizer

load_in_4bit: true
adapter: qlora
lora_r: 32
lora_alpha: 64
lora_dropout: 0.05
lora_target_linear: true

chat_template: tokenizer_default
datasets:
  - path: /workspace/fabrique/elyndor-rp.jsonl
    type: chat_template
    field_messages: messages
    message_field_role: role
    message_field_content: content
    message_field_training: training
test_datasets:
  - path: /workspace/fabrique/elyndor-rp.test.jsonl
    type: chat_template
    split: train
    field_messages: messages
    message_field_role: role
    message_field_content: content
    message_field_training: training

# Prompt élève : environ 9 000 jetons (24 000 + 9 000 caractères) + réponse.
sequence_len: 12288
sample_packing: false
pad_to_sequence_len: false

num_epochs: 2
micro_batch_size: 1
gradient_accumulation_steps: 8
learning_rate: 0.0001
lr_scheduler: cosine
warmup_ratio: 0.05
optimizer: paged_adamw_8bit
weight_decay: 0.0
max_grad_norm: 1.0

bf16: auto
flash_attention: true
gradient_checkpointing: true

eval_steps: 50
save_steps: 100
logging_steps: 5
output_dir: /workspace/fabrique/sortie-lora
